<!doctype html>
<html lang="en">
<head><meta name="referrer" content="strict-origin-when-cross-origin"><script src="compat.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://www.youtube.com"><link rel="preconnect" href="https://i.ytimg.com"><link rel="preconnect" href="https://www.google.com"><title>RetroTV YouTube player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#080a0c;overflow:hidden}#player,iframe{width:100%;height:100%;border:0;display:block}iframe{pointer-events:none;opacity:0}
    #tuning{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;z-index:2;opacity:.85}
    .osd{position:absolute;top:10%;right:8%;z-index:3;color:#64ff53;font:bold clamp(11px,5vw,26px)/1.2 monospace;text-shadow:2px 2px #001500,0 0 3px #64ff5377;pointer-events:none;letter-spacing:.03em;white-space:pre-line}
    .osd.volume,.osd.mute{top:auto;right:auto;left:9%;bottom:12%;max-width:82%}
    .osd.input{right:auto;left:9%}
    .osd.signal{left:0;right:0;top:42%;text-align:center}
    #osd-bars{display:flex;gap:3px;margin-top:8px;height:clamp(8px,3vw,15px)}
    #osd-bars i{width:clamp(4px,1.9vw,11px);background:#173d20;border:1px solid #39843a}
    #osd-bars .lit{background:currentColor;box-shadow:0 0 3px #8aff6455}
    body[data-era='0'] .osd,body[data-era='1'] .osd{color:#eee6d1;font-family:Georgia,serif;font-weight:normal;text-shadow:1px 1px 2px #000}
    body[data-era='0'] #osd-bars i,body[data-era='1'] #osd-bars i{border:0;border-radius:50%;background:#544e41}
    body[data-era='0'] #osd-bars .lit,body[data-era='1'] #osd-bars .lit{background:#eee6d1}
    body[data-era='2'] .osd{color:#eee6c4;text-shadow:1px 1px #292212}
    body[data-era='5'] .osd{font:clamp(11px,4vw,23px)/1.3 Arial,sans-serif;color:#e9f6ff;text-shadow:none;background:#102c47dd;border:1px solid #89b1cf88;border-radius:5px;padding:7px 11px}
    body[data-era='5'] #osd-bars{gap:1px}body[data-era='5'] #osd-bars i{border:0;background:#46657b}body[data-era='5'] #osd-bars .lit{background:#93ccf4}
    [hidden]{display:none!important}@media(prefers-reduced-motion:reduce){#tuning{opacity:.2}}
  #tuning{top:0;right:0;bottom:0;left:0}#osd-bars{gap:0}#osd-bars i{margin-right:3px}</style>
</head>
<body>
  <div id="player"></div>
  <canvas id="tuning" hidden aria-hidden="true"></canvas>
  <div id="osd" class="osd" hidden role="status"><div id="osd-label"></div><div id="osd-bars" hidden></div></div>
  <script src="retro-youtube-player.js"></script>
<script src="bridge.js"></script></body>
</html>
